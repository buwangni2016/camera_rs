[package]
name = "camera_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "camera_rs"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie-private"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Camera capture (cross-platform)

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Time
chrono = "0.4"

# Password hashing
sha2 = "0.10"
hex = "0.4"

# Email alerts
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }

# Async streaming
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Cookie / session
cookie = { version = "0.18", features = ["percent-encode"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10", features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"] }

[profile.release]
opt-level = 3
lto = true
